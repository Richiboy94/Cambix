# Mover este archivo a: .github/workflows/collect.yml

name: Recolectar tipo de cambio (Piloto Benchmark Cambix)

on:
  schedule:
    - cron: '*/30 * * * *'   # cada 30 minutos
  workflow_dispatch:          # permite correrlo manualmente desde la pestaña Actions

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - run: python collect.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CAMBIX_SUBSCRIPTION_KEY: ${{ secrets.CAMBIX_SUBSCRIPTION_KEY }}
